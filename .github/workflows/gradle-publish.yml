name: Build Minecraft 1.12.2 Mod

on:
  release:
    types: [created]
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # 1. Устанавливаем Java 8 (для Forge 1.12.2)
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # 2. Скачиваем совместимый Gradle 4.10.3
    - name: Setup Gradle 4.10.3
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '4.10.3'

    # 3. Собираем мод
    - name: Build Mod with Gradle
      run: gradle build --no-daemon

    # 4. Сохраняем собранный JAR как артефакт сборки (для обычных пушей и проверок)
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-mod-1.12.2
        path: build/libs/*.jar
        retention-days: 7 # Сколько дней хранить файл (по умолчанию 90)

    # 5. Если создан Release — прикрепляем файл к странице релиза
    - name: Upload Artifact to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

